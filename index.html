<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlakesAC | Profile</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="enter-screen" onclick="startSite()">
        <div class="enter-icon"><i class="fas fa-compass"></i></div>
        <div class="enter-text">[ Click to Enter ]</div>
        <div class="enter-sub">- Enter the Flakesverse -</div>
    </div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div id="mouse-glow"></div>
    <canvas id="particle-canvas"></canvas>
    <audio id="myAudio" loop>
        <source src="https://files.catbox.moe/dso8z7.mp3" type="audio/mpeg">
    </audio>
    <video autoplay muted loop playsinline class="bg-video">
        <source src="https://files.catbox.moe/ao2i19.mp4" type="video/mp4">
    </video>
    <div class="card-wrapper">
<div class="card" id="main-card">
            <div class="avatar-container">
                <img src="https://i.pinimg.com/736x/f5/13/c2/f513c24dd750ddc6bf73c03a89bf1e82.jpg" alt="Avatar" class="avatar" id="avatar-img">
                <div class="avatar-ring"></div>
            </div>
            <div class="username" data-text="Flakes">Flakes</div>
            <div class="badges">
                <span class="badge badge-1"><i class="fas fa-check-circle"></i> CONTENT CREATOR</span>
                <span class="badge badge-2"><i class="fas fa-flag-checkered"></i> SIMRACER</span>
            </div>
            <div class="bio" id="bio-text">Content creator and simracer</div>
            <div class="links-container">
                <a href="https://discord.gg/nTyE89ZSyR" class="link-item" target="_blank"><span><i class="fab fa-discord"></i> Discord</span><i class="fas fa-chevron-right"></i></a>
                <a href="https://www.tiktok.com/@.flakes0" class="link-item" target="_blank"><span><i class="fab fa-tiktok"></i> TikTok</span><i class="fas fa-chevron-right"></i></a>
                <a href="https://steamcommunity.com/id/Flakes787/" class="link-item" target="_blank"><span><i class="fab fa-steam"></i> Steam</span><i class="fas fa-chevron-right"></i></a>
                <a href="https://patreon.com/FlakesAC" class="link-item" target="_blank"><span><i class="fab fa-patreon"></i> Patreon</span><i class="fas fa-chevron-right"></i></a>
            </div>
            <div class="music-player">
                <div class="player-header">
                    <div class="album-art-placeholder"><i class="fas fa-music"></i></div>
                    <div class="song-info">
                        <div class="song-name">Love Potions (Slowed Reverb)</div>
                        <div class="song-artist">BJ Lips ft. Princess Paparazzi</div>
                    </div>
                </div>
                <div class="controls-row">
                    <button id="play-pause-btn" onclick="togglePlay()"><i class="fas fa-pause"></i></button>
                    <div class="slider-container">
                        <input type="range" id="seek-slider" value="0" step="1" onchange="seekSong()">
                        <div class="time-display"><span id="current-time">0:00</span><span id="duration-time">0:00</span></div>
                    </div>
                </div>
                <div class="visualizer-container" id="visualizer"></div>
            </div>
            <div class="stats">
                <div class="stat-item"><div class="stat-number" id="view-count">0</div><div class="stat-label">Profile Views</div></div>
                <div class="stat-divider"></div>
                <div class="stat-item"><div class="stat-number" id="follower-count">6,550</div><div class="stat-label">Followers</div></div>
            </div>
        </div>
    </div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.8.1/vanilla-tilt.min.js"></script>
    <script>
        'use strict';
        const audio=document.getElementById('myAudio'),pp=document.getElementById('play-pause-btn');
        function startSite(){audio.volume=0.4;audio.play();document.getElementById('enter-screen').classList.add('hidden');document.body.classList.add('loaded');incViews();startViz();}
        const ns='flakesac_official_site',k='visits';
        async function getViews(){try{let r=await fetch('https://api.counterapi.dev/v1/'+ns+'/'+k),d=await r.json();animCount('view-count',d.count)}catch(e){}}
        getViews();
        async function incViews(){try{let r=await fetch('https://api.counterapi.dev/v1/'+ns+'/'+k+'/up'),d=await r.json();animCount('view-count',d.count)}catch(e){}}
        function animCount(id,t){let el=document.getElementById(id);if(!el)return;let s=parseInt(el.innerText.replace(/[^0-9]/g,''))||0,d=1500,st=performance.now();function step(n){let e=n-st,p=Math.min(e/d,1),c=Math.floor(s+(t-s)*(1-Math.pow(1-p,3)));el.innerText=c.toLocaleString();if(p<1)requestAnimationFrame(step);else el.innerText=t.toLocaleString();}requestAnimationFrame(step);}
        const phrases=['Content creator and simracer','Chasing the perfect lap','Full send or nothing','Building in the Flakesverse'];
        let bi=0,bc=0,bd=false,be=document.getElementById('bio-text');
        function typeBio(){let p=phrases[bi],c=bc===p.length;if(bd){bc--;be.textContent=p.substring(0,bc);}else{bc++;be.textContent=p.substring(0,bc);}let d=bd?30:60;if(!bd&&c){d=2500;bd=true;}else if(bd&&bc===0){bd=false;bi=(bi+1)%phrases.length;d=500;}setTimeout(typeBio,d);}
        setTimeout(typeBio,2000);
        const c=document.getElementById('particle-canvas'),x=c.getContext('2d');let pts=[],mX=0,mY=0;
        function resizeC(){c.width=window.innerWidth;c.height=window.innerHeight;}
        class P{constructor(){this.reset()}reset(){this.x=Math.random()*c.width;this.y=Math.random()*c.height;this.size=Math.random()*2+0.5;this.sx=(Math.random()-0.5)*0.4;this.sy=(Math.random()-0.5)*0.4;this.o=Math.random()*0.5+0.1}update(){this.x+=this.sx;this.y+=this.sy;let dx=mX-this.x,dy=mY-this.y,dist=Math.sqrt(dx*dx+dy*dy);if(dist<200){let f=(200-dist)/200*0.02;this.x-=dx*f;this.y-=dy*f}if(this.x<0||this.x>c.width||this.y<0||this.y>c.height)this.reset()}draw(){x.beginPath();x.arc(this.x,this.y,this.size,0,Math.PI*2);x.fillStyle='rgba(255,255,255,'+this.o+')';x.fill()}}
        function initP(){pts=[];for(let i=0;i<80;i++)pts.push(new P());}
        function drawCon(){for(let i=0;i<pts.length;i++)for(let j=i+1;j<pts.length;j++){let dx=pts[i].x-pts[j].x,dy=pts[i].y-pts[j].y,dist=Math.sqrt(dx*dx+dy*dy);if(dist<120){let o=(1-dist/120)*0.15;x.beginPath();x.moveTo(pts[i].x,pts[i].y);x.lineTo(pts[j].x,pts[j].y);x.strokeStyle='rgba(255,255,255,'+o+')';x.lineWidth=0.5;x.stroke()}}}
        function animP(){x.clearRect(0,0,c.width,c.height);pts.forEach(p=>{p.update();p.draw()});drawCon();requestAnimationFrame(animP);}
        document.addEventListener('mousemove',e=>{mX=e.clientX;mY=e.clientY;let g=document.getElementById('mouse-glow');if(g){g.style.left=e.clientX+'px';g.style.top=e.clientY+'px';}});
        resizeC();initP();animP();window.addEventListener('resize',resizeC);
        let ac,an,da,src,viz=false,vc=document.getElementById('visualizer');
        function makeBars(){if(!vc)return;vc.innerHTML='';for(let i=0;i<24;i++){let b=document.createElement('div');b.className='viz-bar';vc.appendChild(b);}}
        makeBars();
        function startViz(){if(viz||!vc)return;try{ac=new(window.AudioContext||window.webkitAudioContext)();an=ac.createAnalyser();an.fftSize=64;src=ac.createMediaElementSource(audio);src.connect(an);an.connect(ac.destination);da=new Uint8Array(an.frequencyBinCount);viz=true;drawViz()}catch(e){}}
        function drawViz(){if(!viz)return;requestAnimationFrame(drawViz);an.getByteFrequencyData(da);let bars=vc.querySelectorAll('.viz-bar'),step=Math.floor(da.length/bars.length);for(let i=0;i<bars.length;i++){let v=da[i*step]/255,h=Math.max(2,v*22);bars[i].style.height=h+'px';bars[i].style.opacity=0.3+v*0.7;}}
        const ss=document.getElementById('seek-slider'),ct=document.getElementById('current-time'),dt=document.getElementById('duration-time');
        function togglePlay(){if(audio.paused){audio.play();pp.innerHTML='<i class="fas fa-pause"></i>'}else{audio.pause();pp.innerHTML='<i class="fas fa-play"></i>'}}
        audio.ontimeupdate=()=>{if(!isNaN(audio.duration)){ss.value=(audio.currentTime/audio.duration)*100;ct.innerText=fmt(audio.currentTime);dt.innerText=fmt(audio.duration);}};
        function seekSong(){audio.currentTime=audio.duration*(ss.value/100);}
        function fmt(s){let m=Math.floor(s/60),sec=Math.floor(s%60);return m+':'+(sec<10?'0'+sec:sec);}
        let ce=document.querySelector('.card');if(ce&&typeof VanillaTilt!=='undefined')VanillaTilt.init(ce,{max:8,speed:600,glare:true,'max-glare':0.15,perspective:1200,scale:1.02,gyroscope:true});
        document.querySelectorAll('.link-item').forEach(item=>{item.addEventListener('click',function(e){let r=document.createElement('span');r.className='ripple';let rect=this.getBoundingClientRect(),s=Math.max(rect.width,rect.height);r.style.width=r.style.height=s+'px';r.style.left=(e.clientX-rect.left-s/2)+'px';r.style.top=(e.clientY-rect.top-s/2)+'px';this.appendChild(r);setTimeout(()=>r.remove(),600);});});
        const card=document.getElementById('main-card'),av=document.getElementById('avatar-img'),un=document.querySelector('.username');
        if(card&&av&&un){card.addEventListener('mousemove',e=>{let r=card.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-0.5,y=(e.clientY-r.top)/r.height-0.5;av.style.transform='translate('+(x*8)+'px,'+(y*8)+'px) scale(1.05)';av.style.transition='transform 0.1s ease-out';un.style.transform='translate('+(x*6)+'px,'+(y*6)+'px)';un.style.transition='transform 0.15s ease-out';});card.addEventListener('mouseleave',()=>{av.style.transform='';av.style.transition='transform 0.5s ease';un.style.transform='';un.style.transition='transform 0.5s ease';});}
        console.log('%c FlakesAC Profile ','background:#ffffff;color:#000;font-size:14px;padding:6px 12px;border-radius:4px;font-weight:bold;');
        console.log('%c Welcome to the Flakesverse!','color:#cccccc;font-size:12px;');
    </script>
</body>
</html>
